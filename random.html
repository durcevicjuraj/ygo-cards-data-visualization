<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const CARD_PAGE_SIZE = 50;
      let currentPage = 0;

      function renderGallery() {
        const start = currentPage * CARD_PAGE_SIZE;
        const page = filtered.slice(start, start + CARD_PAGE_SIZE);
        const gal = d3
          .select("#gallery")
          .selectAll("img")
          .data(page, (d) => d.id);

        gal.exit().remove();

        gal
          .enter()
          .append("img")
          .attr("class", "thumbnail")
          .attr("src", (d) => d.image)
          .attr("title", (d) => d.name)
          .on("click", (_, d) => {
            onCardClick(d);
            drawRadar();
          })
          .merge(gal);

        updateSelectionUI();
        updatePagination();
      }

      function updatePagination() {
        const total = Math.ceil(filtered.length / CARD_PAGE_SIZE);
        d3.select("#page-info").text(`Stranica ${currentPage + 1} od ${total}`);
      }

      d3.select("#prev-page").on("click", () => {
        currentPage = Math.max(0, currentPage - 1);
        renderGallery();
      });

      d3.select("#next-page").on("click", () => {
        const total = Math.ceil(filtered.length / CARD_PAGE_SIZE);
        currentPage = Math.min(total - 1, currentPage + 1);
        renderGallery();
      });
    </script>
  </body>
</html>
